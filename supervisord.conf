[supervisord]
nodaemon=true

[program:xrdp]
command=/usr/sbin/xrdp --nodaemon
user=root
autorestart=true

[program:xrdp-sesman]
command=/usr/sbin/xrdp-sesman --nodaemon
user=root
autorestart=true

[program:note-collector]
command=/opt/venv/bin/python /app/code/note_collector.py --daemon --interval %(ENV_NOTE_POLL_SECONDS)s
directory=/app
user=dockeruser
autorestart=true
startretries=0
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
